<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión — AGP Intelligence</title>
  <link rel="icon" type="image/png" href="/static/logo_agp.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --accent: #00c2ff; --accent2: #7c3aed;
      --card-bg: #161b22; --border: #30363d;
      --text: #e6edf3;    --muted: #8b949e; --bg: #0d1117;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }

    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem 2.8rem;
      width: 100%; max-width: 420px;
      box-shadow: 0 24px 80px rgba(0,0,0,.6);
    }

    .login-logo {
      display: flex; align-items: center; gap: .75rem;
      margin-bottom: 2rem;
    }
    .login-logo img { height: 36px; }
    .login-logo-text {
      font-size: 1.15rem; font-weight: 800;
      color: var(--accent); letter-spacing: .4px;
    }
    .login-logo-sub {
      font-size: .72rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: 1px;
    }

    .login-title {
      font-size: 1.5rem; font-weight: 900;
      margin-bottom: .3rem;
    }
    .login-subtitle {
      font-size: .85rem; color: var(--muted);
      margin-bottom: 2rem;
    }

    label {
      font-size: .75rem; text-transform: uppercase;
      letter-spacing: .8px; color: var(--muted);
      display: block; margin-bottom: .45rem; font-weight: 600;
    }
    .form-field {
      background: #0d1117;
      border: 2px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      font-size: .95rem;
      padding: .7rem 1rem;
      width: 100%;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      margin-bottom: 1.2rem;
    }
    .form-field:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(0,194,255,.12);
    }
    .form-field::placeholder { color: #484f58; }

    .btn-login {
      background: var(--accent); color: #000;
      font-weight: 800; border: none;
      border-radius: 10px; padding: .75rem;
      font-size: 1rem; width: 100%;
      cursor: pointer; transition: background .2s, transform .1s;
      display: flex; align-items: center; justify-content: center; gap: .5rem;
    }
    .btn-login:hover  { background: #00a8d8; }
    .btn-login:active { transform: scale(.98); }

    .error-box {
      background: #2d1f1f; border: 1px solid #f85149;
      color: #ffa198; border-radius: 10px;
      padding: .7rem 1rem; font-size: .85rem;
      margin-bottom: 1.2rem;
      display: flex; align-items: center; gap: .5rem;
    }

    .pw-wrap { position: relative; }
    .pw-toggle {
      position: absolute; right: .85rem; top: 50%;
      transform: translateY(-60%);
      background: transparent; border: none;
      color: var(--muted); cursor: pointer; font-size: 1rem;
      padding: 0; line-height: 1;
    }
    .pw-toggle:hover { color: var(--accent); }

    .login-footer {
      margin-top: 2rem; text-align: center;
      font-size: .72rem; color: #484f58;
    }
  </style>
</head>
<body>

<div class="login-card">

  <!-- Logo -->
  <div class="login-logo">
    <img src="/static/logo_agp.png" alt="AGP">
    <div>
      <div class="login-logo-text">AGP Intelligence</div>
      <div class="login-logo-sub">Colombia · CO01</div>
    </div>
  </div>

  <div class="login-title">Bienvenido</div>
  <div class="login-subtitle">Ingresa con tu correo corporativo AGP</div>

  {% if error %}
  <div class="error-box">
    <i class="bi bi-exclamation-triangle-fill"></i>
    {{ error }}
  </div>
  {% endif %}

  <form method="POST" action="/login{{ ('?next=' ~ request.args.get('next','')) if request.args.get('next') else '' }}">

    <label for="email"><i class="bi bi-envelope me-1"></i>Correo</label>
    <input id="email" name="email" type="email" class="form-field"
           placeholder="usuario@agpglass.com"
           value="{{ request.form.get('email','') }}"
           autocomplete="email" required autofocus>

    <label for="clave"><i class="bi bi-lock me-1"></i>Contraseña</label>
    <div class="pw-wrap">
      <input id="clave" name="clave" type="password" class="form-field"
             placeholder="••••••••••"
             autocomplete="current-password" required>
      <button type="button" class="pw-toggle" onclick="_togglePw()"
              id="pw-eye" title="Mostrar/ocultar">
        <i class="bi bi-eye" id="pw-icon"></i>
      </button>
    </div>

    <button type="submit" class="btn-login">
      <i class="bi bi-box-arrow-in-right"></i>Ingresar
    </button>
  </form>

  <div class="login-footer">
    Acceso restringido · Solo personal autorizado AGP Glass
  </div>
</div>

<script>
function _togglePw() {
  const inp  = document.getElementById('clave');
  const icon = document.getElementById('pw-icon');
  if (inp.type === 'password') {
    inp.type = 'text';
    icon.className = 'bi bi-eye-slash';
  } else {
    inp.type = 'password';
    icon.className = 'bi bi-eye';
  }
}
document.getElementById('email').addEventListener('input', function() {
  this.value = this.value.toLowerCase();
});
</script>
</body>
</html>
